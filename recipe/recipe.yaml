schema_version: 1

context:
  version: "1.6.0"

package:
  name: libpisp
  version: ${{ version }}

source:
  url: https://github.com/raspberrypi/libpisp/archive/v${{ version }}.tar.gz
  sha256: a48550ef89da1abc7c586fe54c5a03e236aaea6d5f62987c54061e40804673dc
  patches:
    - dma-heap.patch

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
    - python
    - pkg-config
  host:
    - nlohmann_json
  run_exports:
    - ${{ pin_subpackage('libpisp', upper_bound='x.x.x') }}

tests:
  - package_contents:
      lib:
        - pisp
      files:
        - lib/libpisp/backend/backend_default_config.json
about:
  summary: Library for interfacing with the Raspberry Pi PISP
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/raspberrypi/libpisp

extra:
  recipe-maintainers:
    - carlodri
